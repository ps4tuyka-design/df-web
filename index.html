<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil & Oilfield Engineering Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-primary: #0F172A;
            --navy-secondary: #1E293B;
            --navy-accent: #2563EB;
            --bg-light: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 280px; background-color: var(--navy-primary); color: #FFF; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .brand-logo { width: 42px; height: 42px; background: var(--navy-accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #FFF; }
        .nav-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .nav-item a { display: flex; align-items: center; gap: 12px; padding: 12px; color: #94A3B8; text-decoration: none; border-radius: 8px; font-weight: 500; transition: all 0.2s; cursor: pointer; }
        .nav-item.active a, .nav-item a:hover { background-color: var(--navy-secondary); color: #FFF; border-inline-start: 4px solid var(--navy-accent); }

        /* Exchange Rate Box */
        .config-box { background: var(--navy-secondary); padding: 16px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
        .config-box label { display: block; color: #94A3B8; margin-bottom: 6px; }
        .config-box input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #334155; background: #0F172A; color: #FFF; font-weight: bold; }

        /* Main Content */
        .main-content { flex: 1; padding: 32px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-outline { background: #FFF; border: 1px solid var(--border-color); color: var(--navy-primary); }
        .btn-outline:hover { background: #F1F5F9; }

        /* Module Panels */
        .module-panel { display: none; }
        .module-panel.active { display: block; }

        .calculator-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--navy-primary); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 14px; }

        /* Tables & BOQ */
        .results-box { margin-top: 24px; background: #F1F5F9; border-radius: 8px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; background: #FFF; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: start; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background: var(--navy-primary); color: #FFF; }
