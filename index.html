<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil & Oilfield Engineering Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-primary: #0F172A;
            --navy-secondary: #1E293B;
            --navy-accent: #2563EB;
            --bg-light: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 280px; background-color: var(--navy-primary); color: #FFF; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .brand-logo { width: 42px; height: 42px; background: var(--navy-accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #FFF; }
        
        .config-box { background: var(--navy-secondary); padding: 14px; border-radius: 8px; margin-bottom: 20px; font-size: 12px; }
        .config-box label { display: block; color: #94A3B8; margin-bottom: 6px; font-weight: 600; }
        .config-box input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #334155; background: #0F172A; color: #22C55E; font-weight: bold; font-size: 15px; }

        .nav-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .nav-item button { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; padding: 12px; color: #94A3B8; background: transparent; border: none; border-radius: 8px; font-weight: 600; font-size: 13.5px; cursor: pointer; transition: all 0.2s; }
        .nav-item.active button, .nav-item button:hover { background-color: var(--navy-secondary); color: #FFF; border-left: 4px solid var(--navy-accent); }

        /* Main Content */
        .main-content { flex: 1; padding: 32px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .btn { padding: 10px 18px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--navy-primary); }
        .btn-primary { background-color: var(--navy-accent); color: #FFF; }
        .btn-success { background-color: #10B981; color: #FFF; }

        /* Tab Modules */
        .tab-module { display: none; }
        .tab-module.active { display: block; }

        .calculator-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-top: 16px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 16px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 6px; color: var(--navy-primary); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 14px; font-weight: 500; }

        /* Visualizer Container */
        .visualizer-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
        canvas { width: 100%; height: 260px; background: #0F172A; border-radius: 8px; }

        /* Tables & Results */
        .results-box { margin-top: 24px; background: #F1F5F9; border-radius: 8px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; background: #FFF; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        th { background: var(--navy-primary); color: #FFF; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        .badge-danger { background: #FEE2E2; color: #DC2626; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }

        /* Printable PDF Styling */
        @media print {
            body { background: #FFF; color: #000; }
            .sidebar, .btn, .config-box { display: none !important; }
            .main-content { padding: 0; }
            .tab-module { display: none !important; }
            .tab-module.active { display: block !important; }
            .calculator-card { border: none; padding: 0; }
        }
    </style>
</head>
